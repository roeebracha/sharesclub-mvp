name: Manual Approval Gate

on:
  issue_comment:
    types: [created]

permissions:
  statuses: write

jobs:
  approve:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/approve') &&
      github.event.comment.user.login == 'roeebracha'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Mark manual-approval check green
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.sha }}" \
            -f state=success \
            -f context="manual-approval" \
            -f description="Approved via /approve by ${{ github.event.comment.user.login }}"
